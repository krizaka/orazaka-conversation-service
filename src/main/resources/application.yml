# What a deployment decides; secrets from the environment (.env). Operating defaults: META-INF/orazaka/conversation-service-defaults.yml.
spring:
  application.name: orazaka-conversation-service
  threads:
    virtual:
      enabled: true  # AGENTS.md §4 — an SSE stream holds its thread for the whole exchange
  datasource: { url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orazaka_db}", username: "${SPRING_DATASOURCE_USERNAME:orazaka_app}", password: "${SPRING_DATASOURCE_PASSWORD:}" }
  flyway:
    # The schema is db/migration (V1 = the baseline), applied at startup as the owner role, never by hand (krizaka-internal#2255).
    # The migrator connection is distinct from the runtime datasource; locally it falls back to the datasource values.
    enabled: true
    locations: classpath:db/migration
    url: "${DATABASE_CONVERSATION_MIGRATOR_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orazaka_db}}"
    user: "${DATABASE_CONVERSATION_MIGRATOR_USER:${SPRING_DATASOURCE_USERNAME:orazaka_app}}"
    password: "${DATABASE_CONVERSATION_MIGRATOR_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}"
    # orazaka_db is shared by three contexts (conversation, job, governance), one history table each.
    table: flyway_history_conversation
    # baseline-on-migrate adopts a non-empty database without history; it stays only until the first reset (then false).
    baseline-on-migrate: true
    # Trap: on a fresh orazaka_db where another context already created its tables, baselining at the default 1 would
    # mark V1 applied and SKIP it. Baselining at 0 makes V1 always run (covered by OrazakaDbSharedMigrationsIT).
    baseline-version: "0"
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  rabbitmq: { host: "${RABBITMQ_HOST:localhost}", port: "${RABBITMQ_PORT:5672}", username: "${RABBITMQ_USER:guest}", password: "${RABBITMQ_PASS:}" }
  data.redis.url: ${REDIS_URL:redis://localhost:6379}
server.port: ${CONVERSATION_PORT:8080}
krizaka:
  observability: { product: orazaka, service: conversation, version: "@project.version@" }
  security.jwt.secret: ${IDENTITY_JWT_SECRET:}
  messaging.exchanges: { events: orazaka.events, dead-letter: orazaka.dlx }
  web.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  users.client: { base-url: "${IDENTITY_URL:http://localhost:8083}", service-secret: "${IDENTITY_JWT_SECRET:}", service-name: orazaka-conversation-service }
  billing: { enabled: "${BILLING_ENABLED:false}", base-url: "${BILLING_INTERNAL_URL:http://localhost:8095}", service-secret: "${IDENTITY_JWT_SECRET:}" }
orazaka:
  core: { orchestration.enabled: "${ORCHESTRATION_ENABLED:true}", knowledge: { base-url: "${KNOWLEDGE_URL:http://localhost:8084}", service-secret: "${IDENTITY_JWT_SECRET:}" } }
  studio: { enabled: "${STUDIO_CLIENT_ENABLED:true}", base-url: "${STUDIO_INTERNAL_URL:http://localhost:8096}", service-secret: "${IDENTITY_JWT_SECRET:}" }
